[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuego-nemotron-pipeline"
version = "0.1.0"
description = "NVIDIA Nemotron API access"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embedding = ["fastembed>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["fuego*"]
