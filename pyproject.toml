[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuego-nemotron-pipeline"
version = "0.1.0"
description = "Daily topic feeds with NVIDIA Nemotron"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fuego = "fuego.__main__:main"

[tool.setuptools.packages.find]
include = ["fuego*"]
